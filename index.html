<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sound Detectives – Sunrise 4 Unit 1</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2a4a;--bg:#fff7e8;--v:#e5252a;--ei:#2f6feb;--u:#12a06a;--o:#e07b00;--a:#8a4fd6;--sh:0 5px 0 rgba(28,42,74,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{height:100%;height:-webkit-fill-available}
body{margin:0;height:100vh;height:-webkit-fill-available;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font:600 clamp(18px,2vw,30px)/1.25 'Baloo 2','Trebuchet MS',system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;min-height:56px;min-width:56px;border-radius:16px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.5em 1em;padding:.4em 1em;background:var(--ink);color:#fff}
h1{margin:0;font-size:1.3em;font-weight:800}h1 small{font-size:.55em;font-weight:500;opacity:.8;margin-left:.6em}
nav{display:flex;flex-wrap:wrap;gap:.4em;margin-left:auto}
nav button{padding:0 1em;background:rgba(255,255,255,.14);color:#fff;font-weight:700}
nav button.on{background:#ffd54a;color:var(--ink)}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:.8em 1em}
.screen.on{display:block}
footer{display:flex;align-items:center;gap:1em;padding:.5em 1em;background:#fff;border-top:3px solid #eadfc4}
.sp{flex:1}
.b1,.b2{padding:0 1.2em;font-weight:800;box-shadow:var(--sh)}
.b1{background:var(--ei);color:#fff}.b2{background:#fff;border:3px solid var(--ink)}
#bp,#bn{min-height:64px;min-width:130px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.6em;margin-bottom:.7em}
.lab{font-weight:700;opacity:.8}
.v{color:var(--v)}b.v{font-weight:800}
.ipa{font-family:'Noto Sans','Segoe UI','DejaVu Sans',Arial,sans-serif;font-weight:700}
.hl{transform:scale(1.07);outline:5px solid #ffb703;background:#fff3c4!important;color:var(--ink)!important;border-radius:14px}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
/* 1 Listen */
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:.7em}
.card{position:relative;background:#fff;border:4px solid var(--ink);border-radius:20px;min-height:24vh;font-size:1.9em;font-weight:800;box-shadow:var(--sh);transition:transform .2s}
.card .n{position:absolute;top:.2em;left:.5em;font-size:.5em;opacity:.5}
.q{font-style:normal;font-size:1.2em}
.g.closed .card:not(.show) .w,.g:not(.closed) .q,.card.show .q{display:none}
/* 2 Look & Say */
.split{display:grid;grid-template-columns:1.2fr 1fr;gap:1em;align-items:start}
.fp{background:#fff;border:4px solid var(--ink);border-radius:24px;padding:.6em;text-align:center;min-height:52vh;display:flex;flex-direction:column;justify-content:center}
#big{font-size:clamp(56px,10vw,170px);font-weight:800;min-height:1.3em;display:flex;align-items:center;justify-content:center}
#big span{animation:pop .35s}.ph{font-size:.28em;opacity:.5}
.cap{font-size:1.5em;min-height:1.6em}.cap .on{background:#ffd54a;border-radius:8px;padding:0 .25em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.g2 button{background:#fff;border:3px solid var(--ink);font-size:1.6em;font-weight:800;min-height:96px;box-shadow:var(--sh)}
.g2 button.sel{background:#ffd54a}
/* 3 Find the sound */
.sw{display:grid;grid-template-columns:1fr 1.5fr;gap:1em;align-items:start}
#bank,.bw{display:flex;flex-wrap:wrap;gap:.5em}
#bank{background:#fff;border:4px dashed #c9b98f;border-radius:20px;padding:.6em;min-height:30vh;align-content:flex-start}
.t{background:#fff;border:3px solid var(--ink);padding:0 .7em;font-size:1.45em;font-weight:800;box-shadow:var(--sh)}
.t.no{animation:shake .4s}
.t.in{pointer-events:none;box-shadow:none;background:#f4f8ff;font-size:1.2em;animation:pop .3s}
#buckets{display:grid;grid-template-columns:1fr 1fr;gap:.7em}
.bk{background:#fff;border:4px solid var(--c);border-radius:18px;padding:.5em;min-height:24vh}
.bk.act{outline:6px solid #ffd54a}.bk.hide{display:none}
.bh{display:flex;align-items:baseline;gap:.5em;background:var(--c);color:#fff;border-radius:10px;padding:.15em .6em;margin-bottom:.5em;font-size:1.15em}
.bh .ex{display:inline-block;padding:0 .3em;font-weight:800}
#turns{display:flex;align-items:center;gap:.35em}
.tn{width:56px;padding:0;border-radius:50%;background:#fff;border:3px solid var(--ink);font-weight:800}
.tn.on{background:#ffd54a;transform:scale(1.15)}
#mb{flex:1;min-width:260px;min-height:56px;background:#fff;border-radius:14px;border:3px dashed #c9b98f;padding:.3em .8em;display:flex;align-items:center;font-size:.9em}
/* 4 Move */
.leg{display:grid;grid-template-columns:repeat(2,1fr);gap:.6em;margin-bottom:.8em}
.lg{background:#fff;border:4px solid var(--c);border-radius:16px;padding:.4em .8em;font-size:.95em}
.stage{background:#fff;border:4px solid var(--ink);border-radius:24px;text-align:center;padding:.5em;margin-bottom:.8em}
#tw{font-size:clamp(60px,12vw,190px);font-weight:800;line-height:1.1}
#ta{font-size:2em;min-height:1.5em}
@media (max-width:820px){.g{grid-template-columns:repeat(2,1fr)}.split,.sw{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🔍 Sound Detectives<small>Sunrise 4 · Unit 1 · Same vowel sounds</small></h1><nav id="tabs"></nav></header>
<main>
<section class="screen on">
 <div class="bar"><button id="bk" class="b2">📖 Open books</button><button id="all" class="b1">▶ Read all together</button><span class="lab" id="lab">Books closed – listen!</span></div>
 <div id="g" class="g closed"></div>
</section>
<section class="screen">
 <div class="split">
  <div class="fp"><div id="big"><span class="ph">Tap a word ▶</span></div><div id="cap" class="cap">&nbsp;</div><div id="ipa" class="ipa"></div></div>
  <div id="g2" class="g2"></div>
 </div>
</section>
<section class="screen">
 <div class="bar"><div id="turns"></div><div id="mb"></div><button id="rs" class="b2">↻ Reset</button></div>
 <div class="sw"><div id="bank"></div><div id="buckets"></div></div>
</section>
<section class="screen">
 <div id="leg" class="leg"></div>
 <div class="stage"><div id="tw">?</div><div id="ta"></div></div>
 <div class="bar"><button id="nw" class="b1">🎲 Next word</button><button id="sa" class="b2">👀 Show action</button></div>
</section>
</main>
<footer><button id="bp" class="b2">◀ Back</button><div class="sp"></div><button id="bn" class="b1">Next ▶</button></footer>
<script>
const $=i=>document.getElementById(i),qa=s=>[...document.querySelectorAll(s)];
let T=[];
const later=(f,ms)=>T.push(setTimeout(f,ms));
function clr(){T.forEach(clearTimeout);T=[];qa('.hl').forEach(e=>e.classList.remove('hl'))}
function chant(els,ms,fin,on){clr();els.forEach((e,i)=>later(()=>{els.forEach(x=>x.classList.remove('hl'));e.classList.add('hl');on&&on(e)},i*ms));later(()=>{els.forEach(x=>x.classList.remove('hl'));fin&&fin()},els.length*ms)}
const plain=m=>m.replace(/[\[\]]/g,''),html=m=>m.replace(/\[(.+?)\]/g,'<b class=v>$1</b>'),shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);

/* word, vowel letters, IPA */
const W=[['b[o]x','o','ɒ'],['n[u]t','u','ʌ'],['tr[ai]n','ai','eɪ'],['noteb[oo]k','oo','ʊ'],['d[e]sk','e','e'],['t[ea]cher','ea','iː'],['r[ea]ding','ea','iː'],['wr[i]t[e]','i-e','aɪ']];

/* 1 Listen: teacher says each word, children repeat */
$('g').innerHTML=W.map((w,i)=>`<button class="card"><span class="n">${i+1}</span><i class="q">👂</i><span class="w">${plain(w[0])}</span></button>`).join('');
const cards=qa('#g .card');
cards.forEach(c=>c.onclick=()=>c.classList.toggle('show'));
$('bk').onclick=()=>{const c=$('g').classList.toggle('closed');cards.forEach(x=>x.classList.remove('show'));$('bk').textContent=c?'📖 Open books':'📕 Close books';$('lab').textContent=c?'Books closed – listen!':'Books open – read and repeat!'};
$('all').onclick=()=>{cards.forEach(x=>x.classList.remove('show'));chant(cards,1100,null,c=>c.classList.add('show'))};

/* 2 Look & Say: word... word... vowel... vowel... word */
$('g2').innerHTML=W.map(w=>`<button>${html(w[0])}</button>`).join('');
const wb=qa('#g2 button');
function say(i){clr();wb.forEach((b,j)=>b.classList.toggle('sel',j==i));const[m,v,p]=W[i],w=plain(m),it=[w,w,v,v,w];$('ipa').textContent='/'+p+'/';
 it.forEach((_,k)=>later(()=>{$('big').innerHTML='<span>'+(k==2||k==3?'<b class=v>'+v+'</b>':html(m))+'</span>';$('cap').innerHTML=it.map((t,j)=>'<span'+(j==k?' class=on':'')+'>'+t+'</span>').join('… ')},k*1100))}
wb.forEach((b,i)=>b.onclick=()=>say(i));

/* 3 Find the sound */
const B=[['ei','train','eɪ'],['u','notebook','ʊ'],['o','box','ɒ'],['a','nut','ʌ']],
S=[['doll','o'],['doctor','o'],['jug','a'],['young','a'],['plane','ei'],['grey','ei'],['look','u'],['goodbye','u']];
let act,turn,bonus;
const bi=id=>B.find(b=>b[0]==id),left=id=>qa('#bank .t').some(t=>t.dataset.s==id);
function msg(t){$('mb').textContent=t}
$('turns').innerHTML='<span class="lab">Turn:</span>'+[1,2,3,4,5,6].map(n=>`<button class="tn">${n}</button>`).join('');
const tn=qa('#turns .tn');
function drawTurn(){tn.forEach((b,i)=>b.classList.toggle('on',i==turn))}
tn.forEach((b,i)=>b.onclick=()=>{turn=i;drawTurn()});
function focusMsg(){const[,ex,p]=bi(act);return(bonus?'⭐ Bonus! ':'')+'Focus on the /'+p+'/ sound, like in “'+ex+'”. Tap the words with the same sound.'}
function mark(){qa('.bk').forEach(b=>b.classList.toggle('act',b.dataset.id==act));msg(focusMsg())}
function advance(){
 if(!bonus&&!left('ei')&&!left('u')){bonus=true;qa('.bonus').forEach(b=>b.classList.remove('hide'))}
 const n=['ei','u','o','a'].find(i=>left(i)&&(bonus||i=='ei'||i=='u'));
 if(!n){qa('.bk').forEach(b=>b.classList.remove('act'));return'🎉 All sorted! Say every group together.'}
 act=n;qa('.bk').forEach(b=>b.classList.toggle('act',b.dataset.id==act));return focusMsg()}
function done(id){const bk=document.querySelector('.bk[data-id='+id+']'),els=[bk.querySelector('.ex'),...bk.querySelectorAll('.t')],m=advance();msg('👏 Say together!');chant(els,1000,()=>msg(m))}
function initSort(){clr();act='ei';turn=0;bonus=false;
 $('bank').innerHTML=shuffle(S).map(([w,s])=>`<button class="t" data-s="${s}">${w}</button>`).join('');
 $('buckets').innerHTML=B.map(([id,ex,p],i)=>`<div class="bk${i>1?' bonus hide':''}" data-id="${id}" style="--c:var(--${id})"><div class="bh"><b class="ex">${ex}</b><span class="ipa">/${p}/</span></div><div class="bw"></div></div>`).join('');
 drawTurn();mark()}
$('bank').onclick=e=>{const t=e.target.closest('.t');if(!t)return;
 if(t.dataset.s==act){document.querySelector('.bk[data-id='+act+'] .bw').appendChild(t);t.classList.add('in');turn=(turn+1)%6;drawTurn();
  if(left(act))msg('✔ Yes! “'+t.textContent+'” has the same sound. Find more!');else done(act)}
 else{t.classList.add('no');setTimeout(()=>t.classList.remove('no'),500);msg('Hmm… say “'+t.textContent+'”. Is it the /'+bi(act)[2]+'/ sound? Try another word.')}};
$('buckets').onclick=e=>{const b=e.target.closest('.bk');if(b){act=b.dataset.id;mark()}};
$('rs').onclick=initSort;

/* 4 Move: TPR break */
const A={ei:['⬆️','Jump!'],u:['👏','Clap!'],o:['🔄','Spin!'],a:['👇','Touch your toes!']},
P=[['train','ei'],['plane','ei'],['grey','ei'],['notebook','u'],['look','u'],['goodbye','u'],['box','o'],['doll','o'],['doctor','o'],['nut','a'],['jug','a'],['young','a']];
$('leg').innerHTML=B.map(([id,ex,p])=>`<div class="lg" style="--c:var(--${id})"><b class="ipa">/${p}/</b> ${ex} → ${A[id][0]} ${A[id][1]}</div>`).join('');
let lw,ls;
$('nw').onclick=()=>{let x;do x=P[Math.random()*P.length|0];while(x==lw);lw=x;ls=x[1];$('tw').textContent=x[0];$('ta').textContent=''};
$('sa').onclick=()=>{if(ls)$('ta').textContent=A[ls][0]+' '+A[ls][1]};

/* Navigation */
let cur=0;
$('tabs').innerHTML=['1 Listen','2 Look &amp; Say','3 Find the Sound','4 Move!'].map(t=>`<button>${t}</button>`).join('');
const tb=qa('#tabs button'),sc=qa('.screen');
function go(n){clr();cur=n;sc.forEach((s,i)=>s.classList.toggle('on',i==n));tb.forEach((t,i)=>t.classList.toggle('on',i==n));$('bp').disabled=!n;$('bn').disabled=n==3}
tb.forEach((t,i)=>t.onclick=()=>go(i));
$('bp').onclick=()=>go(cur-1);$('bn').onclick=()=>go(cur+1);
initSort();go(0);
</script>
</body>
</html>
